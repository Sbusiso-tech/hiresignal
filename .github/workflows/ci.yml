name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,pipeline]"
      - name: Lint
        run: ruff check src tests airflow
      - name: Test
        run: pytest -q

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        # dbt-postgres 1.8 allows dbt-core>=1.8, and pip will take the 2.0 pre-release,
        # which does not support the Postgres adapter yet.
        run: pip install "dbt-core==1.8.9" "dbt-postgres==1.8.2"
      - name: Parse the project
        working-directory: dbt
        run: dbt parse --profiles-dir .
