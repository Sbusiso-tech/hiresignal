version: 2

sources:
  - name: core
    description: De-duplicated job history upserted by the Spark batch job.
    schema: core
    loaded_at_field: last_seen_at
    freshness:
      warn_after: {count: 2, period: day}
      error_after: {count: 7, period: day}
    tables:
      - name: jobs
        description: One row per job posting (job_id = "<source>:<source_id>").
        columns:
          - name: job_id
            data_tests: [unique, not_null]
      - name: job_skills
        description: Skills extracted from each posting's title, description and tags.
        freshness: null
      - name: pipeline_runs
        description: Audit log of Spark batch runs.
        freshness: null
