name: jobmarket

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  S3_ENDPOINT: http://rustfs:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
  LAKE_BUCKET: ${LAKE_BUCKET:-jobs-lake}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-jobmarket}
  POSTGRES_USER: ${POSTGRES_USER:-jobmarket}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobmarket}
  REDIS_URL: redis://redis:6379/0
  SFTP_HOST: sftp
  SFTP_PORT: "22"
  SFTP_USER: ${SFTP_USER:-partner}
  SFTP_PASSWORD: ${SFTP_PASSWORD:-partner}
  CRM_HOST: crm-db
  CRM_PORT: "5432"
  CRM_DB: ${CRM_DB:-crm}
  CRM_USER: ${CRM_USER:-crm}
  CRM_PASSWORD: ${CRM_PASSWORD:-crm}

x-app: &app
  image: jobmarket-app:latest
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  env_file:
    - path: .env
      required: false
  environment: *app-env
  networks: [jobmarket]

x-depends-core: &depends-core
  kafka: {condition: service_healthy}
  rustfs: {condition: service_healthy}
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}

services:
  # ------------------------------------------------------------------ infrastructure
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [jobmarket]

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: jobmarket
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    depends_on:
      kafka: {condition: service_healthy}
    networks: [jobmarket]

  # S3-compatible object storage for the data lake (MinIO no longer publishes images; RustFS is a drop-in)
  rustfs:
    image: rustfs/rustfs:1.0.1
    ports: ["9000:9000", "9001:9001"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes: [lake-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [jobmarket]

  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobmarket}
      POSTGRES_USER: ${POSTGRES_USER:-jobmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobmarket}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/00-airflow.sql:/docker-entrypoint-initdb.d/00-airflow.sql:ro
      - ./src/jobmarket/sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [jobmarket]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [jobmarket]

  # Operational database of the in-house recruitment desk (a source system, not the warehouse)
  crm-db:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    ports: ["5433:5432"]
    environment:
      POSTGRES_DB: ${CRM_DB:-crm}
      POSTGRES_USER: ${CRM_USER:-crm}
      POSTGRES_PASSWORD: ${CRM_PASSWORD:-crm}
    volumes:
      - crm-data:/var/lib/postgresql/data
      - ./src/jobmarket/sql/crm_schema.sql:/docker-entrypoint-initdb.d/10-crm-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [jobmarket]

  # Partner SFTP server: a recruitment agency drops a daily CSV export into upload/exports
  sftp:
    image: atmoz/sftp:alpine
    command: ["${SFTP_USER:-partner}:${SFTP_PASSWORD:-partner}:1001:100:upload"]
    ports: ["2222:22"]
    volumes:
      - sftp-data:/home/${SFTP_USER:-partner}/upload
      - ./docker/sftp/fix-permissions.sh:/etc/sftp.d/fix-permissions.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [jobmarket]

  # ------------------------------------------------------------- streaming services
  lake-sink:
    <<: *app
    command: ["python", "-m", "jobmarket.lake_sink"]
    restart: unless-stopped
    depends_on: *depends-core

  realtime:
    <<: *app
    command: ["python", "-m", "jobmarket.realtime"]
    restart: unless-stopped
    depends_on: *depends-core

  api:
    <<: *app
    command: ["uvicorn", "jobmarket.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on: *depends-core

  # ------------------------------------------------- batch jobs (docker compose run)
  ingest:
    <<: *app
    profiles: [jobs]
    command: ["python", "-m", "jobmarket.ingest"]
    depends_on: *depends-core

  spark:
    <<: *app
    profiles: [jobs]
    command: ["python", "-m", "jobmarket.spark_jobs.transform_jobs"]
    ports: ["4040:4040"]
    depends_on: *depends-core

  dbt:
    image: jobmarket-dbt:latest
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    profiles: [jobs]
    environment: *app-env
    command: ["build"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [jobmarket]

  # ------------------------------------------------------- orchestration (optional)
  airflow:
    image: apache/airflow:2.10.5-python3.11
    profiles: [airflow]
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --password admin --firstname Admin --lastname User
                 --role Admin --email admin@example.com || true) &&
               (airflow scheduler &) &&
               exec airflow webserver"
    ports: ["8080:8080"]
    group_add: ["${DOCKER_GID:-999}"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-jobmarket}:${POSTGRES_PASSWORD:-jobmarket}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: change-me-in-production
      JOBMARKET_NETWORK: jobmarket_net
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: {condition: service_healthy}
    networks: [jobmarket]

  # ------------------------------------------------------ change data capture (optional)
  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    profiles: [cdc]
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: jobmarket-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    depends_on:
      kafka: {condition: service_healthy}
      crm-db: {condition: service_healthy}
    networks: [jobmarket]

  cdc-consumer:
    <<: *app
    profiles: [cdc]
    command: ["python", "-m", "jobmarket.cdc_consumer"]
    restart: unless-stopped
    depends_on: *depends-core

networks:
  jobmarket:
    name: jobmarket_net

volumes:
  kafka-data:
  lake-data:
  postgres-data:
  redis-data:
  sftp-data:
  crm-data:
