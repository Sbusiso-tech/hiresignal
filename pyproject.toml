[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmarket"
version = "1.0.0"
description = "Job Market Intelligence Platform: job APIs -> Kafka -> data lake -> Spark -> PostgreSQL -> dbt -> BI"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pipeline = [
    "confluent-kafka>=2.5",
    "boto3>=1.34",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "paramiko>=3.4",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
]
spark = ["pyspark==3.5.3"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobmarket = ["*.yml", "sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
