# Skill taxonomy used to extract technologies from job descriptions and tags.
#
# category:
#   Canonical Skill Name: [alias, alias, ...]
#
# Alias syntax:
#   plain      case-insensitive literal, matched on token boundaries
#   =Literal   case-sensitive literal (for words that are also common English, e.g. "Excel")
#   #tag       only matched against the structured tag list, never free text (e.g. "go", "r", "c")
#   re:...     raw regular expression, case-sensitive

Programming Language:
  Python: [python, python3]
  SQL: [sql, t-sql, pl/sql, plsql, tsql]
  Java: [java, "=Java"]
  JavaScript: [javascript, ecmascript, "=JS"]
  TypeScript: [typescript]
  C#: ["c#", csharp]
  C++: ["c++", cpp]
  C: ["#c", "re:(?<![\\w+#.\\-/])C(?=\\s*(?:/|,|and|or)\\s*C\\+\\+)", "re:\\bC programming\\b"]
  Go: [golang, "#go", "re:\\bGo(?=\\s*(?:,|/|\\)|developer|engineer|programming|lang\\b))"]
  Rust: ["=Rust", "#rust"]
  Scala: [scala]
  Kotlin: [kotlin]
  Swift: ["=Swift", "#swift"]
  PHP: [php]
  Ruby: [ruby]
  R: ["#r", rstudio, "re:\\bR(?=\\s*(?:,|/|and|or)\\s*(?:Python|SAS|SQL|Stata|MATLAB|Julia)\\b)", "re:\\b(?:Python|SAS|SQL|Stata|MATLAB)\\s*(?:,|/|and|or)\\s*R\\b(?![-'])", "re:\\bR programming\\b"]
  Bash: [bash, shell scripting, "#shell"]
  Dart: ["=Dart"]
  Elixir: [elixir]
  MATLAB: [matlab]
  SAS: ["=SAS"]

